# Minimal Profile - Low resource, basic RAG
# Target: Development, testing, resource-constrained environments

llm:
  provider: openai
  model: gpt-4o-mini

embedding:
  provider: openai
  model: text-embedding-3-small
  dimension: 1536

retrieval:
  strategy: vector
  reranker:
    enabled: false
    provider: flashrank
  contextual_retrieval:
    enabled: false
  grader:
    enabled: false

memory:
  scopes_enabled: false
  default_scope: session
  consolidation_enabled: false

community:
  detection_enabled: false

ingestion:
  crawl_profile: fast
  fallback_enabled: false
  codebase_enabled: false
  external_sync_enabled: false

voice:
  enabled: false

graph_intelligence:
  lazy_rag_enabled: false
  query_routing_enabled: false
  graph_reranker_enabled: false

observability:
  prometheus_enabled: false

protocols:
  a2a:
    enabled: true
    max_sessions_per_tenant: 10
    max_messages_per_session: 100
